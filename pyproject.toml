[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncaambb"
version = "0.1.0"
description = "Composite NCAA D1 men's basketball rankings from free public rating systems"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "brotli>=1.1",
  "pandas>=2.1",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.5",
  "tzdata>=2024.1",  # time-zone database for Eastern dates on any OS
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "markdown>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real websites (run with -m live)"]
addopts = "-m 'not live'"
